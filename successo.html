<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Inviato - FuturENERGY</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f0fdf4;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 1rem;
            box-sizing: border-box;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(4, 120, 87, 0.05);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border-top: 5px solid #16a34a;
        }
        h1 { color: #065f46; font-size: 1.5rem; margin-bottom: 1rem; }
        p { color: #4b5563; font-size: 0.95rem; margin-bottom: 2rem; line-height: 1.5; }
        .btn {
            display: inline-block;
            background-color: #047857;
            color: white;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #065f46; }
    </style>
</head>
<body>
    <div class="card">
        <h1>✅ Report Inviato con Successo!</h1>
        <p>I dati relativi all'attività commerciale e ai Sales Account gestiti sono stati trasmessi correttamente a FuturENERGY.</p>
        <a href="index.html" class="btn">Compila un nuovo report</a>
    </div>
</body>
</html>
